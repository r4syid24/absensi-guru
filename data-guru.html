<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Guru - Aplikasi Absensi Guru</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-5">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

                <div>
                    <h1 class="text-2xl font-bold">
                        👨‍🏫 Data Guru
                    </h1>

                    <p class="text-blue-100 text-sm mt-1">
                        Kelola data guru sekolah
                    </p>
                </div>

                <button
                    onclick="kembaliDashboard()"
                    class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition">
                    ← Dashboard
                </button>

            </div>

        </div>
    </header>


    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-6">


        <!-- FORM -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 mb-6">

            <div class="border-b px-6 py-4">

                <h2
                    id="judulForm"
                    class="text-lg font-bold text-gray-800">
                    ➕ Tambah Data Guru
                </h2>

                <p class="text-sm text-gray-500 mt-1">
                    Isi data guru dengan lengkap.
                </p>

            </div>


            <div class="p-6">

                <form id="formGuru">

                    <input
                        type="hidden"
                        id="editId">


                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                        <!-- NAMA -->
                        <div class="md:col-span-2">

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Nama Lengkap
                            </label>

                            <input
                                type="text"
                                id="nama"
                                placeholder="Contoh: MUHAMMAD RASYID, S.PD.I"
                                required
                                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        </div>


                        <!-- NIP -->
                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                NIP
                            </label>

                            <input
                                type="text"
                                id="nip"
                                placeholder="Contoh: 198309282025211071"
                                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        </div>


                        <!-- NIK -->
                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                NIK
                            </label>

                            <input
                                type="text"
                                id="nik"
                                placeholder="Nomor Induk Kependudukan"
                                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        </div>


                        <!-- JABATAN -->
                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Jabatan
                            </label>

                            <select
                                id="jabatan"
                                class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">

                                <option value="">
                                    Pilih Jabatan
                                </option>

                                <option value="Kepala Sekolah">
                                    Kepala Sekolah
                                </option>

                                <option value="Guru Kelas">
                                    Guru Kelas
                                </option>

                                <option value="Guru Mata Pelajaran">
                                    Guru Mata Pelajaran
                                </option>

                                <option value="Guru PJOK">
                                    Guru PJOK
                                </option>

                                <option value="Guru PAI">
                                    Guru PAI
                                </option>

                                <option value="Operator Sekolah">
                                    Operator Sekolah
                                </option>

                                <option value="Tenaga Kependidikan">
                                    Tenaga Kependidikan
                                </option>

                                <option value="Lainnya">
                                    Lainnya
                                </option>

                            </select>

                        </div>


                        <!-- STATUS -->
                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Status Kepegawaian
                            </label>

                            <select
                                id="status"
                                class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">

                                <option value="">
                                    Pilih Status
                                </option>

                                <option value="PNS">
                                    PNS
                                </option>

                                <option value="PPPK">
                                    PPPK
                                </option>

                                <option value="Non ASN">
                                    Non ASN
                                </option>

                                <option value="Honorer">
                                    Honorer
                                </option>

                                <option value="Lainnya">
                                    Lainnya
                                </option>

                            </select>

                        </div>


                    </div>


                    <!-- TOMBOL -->
                    <div class="flex flex-wrap gap-3 mt-6">

                        <button
                            type="submit"
                            id="btnSimpan"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition">

                            💾 Simpan Guru

                        </button>


                        <button
                            type="button"
                            onclick="resetForm()"
                            class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-lg font-semibold transition">

                            🔄 Batal / Reset

                        </button>

                    </div>

                </form>

            </div>

        </section>



        <!-- DAFTAR GURU -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200">

            <div class="border-b px-6 py-4">

                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                    <div>

                        <h2 class="text-lg font-bold text-gray-800">
                            📋 Daftar Guru
                        </h2>

                        <p class="text-sm text-gray-500 mt-1">
                            <span id="jumlahGuru">0</span> guru terdaftar
                        </p>

                    </div>


                    <!-- PENCARIAN -->
                    <div class="w-full md:w-80">

                        <input
                            type="text"
                            id="cariGuru"
                            placeholder="🔍 Cari nama atau NIP..."
                            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">

                    </div>

                </div>

            </div>


            <!-- TABLE -->
            <div class="overflow-x-auto">

                <table class="w-full border-collapse">

                    <thead>

                        <tr class="bg-gray-50">

                            <th class="border-b px-4 py-3 text-center text-sm">
                                No
                            </th>

                            <th class="border-b px-4 py-3 text-left text-sm">
                                Nama Guru
                            </th>

                            <th class="border-b px-4 py-3 text-left text-sm">
                                NIP
                            </th>

                            <th class="border-b px-4 py-3 text-left text-sm">
                                Jabatan
                            </th>

                            <th class="border-b px-4 py-3 text-left text-sm">
                                Status
                            </th>

                            <th class="border-b px-4 py-3 text-center text-sm">
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tabelGuru">

                        <tr>

                            <td
                                colspan="6"
                                class="px-4 py-8 text-center text-gray-500">

                                Belum ada data guru.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


        <!-- STATUS -->
        <div
            id="pesan"
            class="hidden mt-5 rounded-lg px-4 py-3 text-sm font-medium">
        </div>


    </main>


    <!-- JAVASCRIPT -->
    <script>

        // ==========================================
        // STORAGE
        // ==========================================

        const STORAGE_KEY = "dataGuru";


        let dataGuru = [];


        // ==========================================
        // DASHBOARD
        // ==========================================

        function kembaliDashboard() {

            window.location.href =
                "dashboard.html";

        }


        // ==========================================
        // LOAD DATA
        // ==========================================

        function loadData() {

            const data =
                localStorage.getItem(STORAGE_KEY);


            if (!data) {

                dataGuru = [];

                return;

            }


            try {

                const hasil =
                    JSON.parse(data);


                dataGuru =
                    Array.isArray(hasil)
                    ? hasil
                    : [];


            } catch (error) {

                console.error(error);

                dataGuru = [];

            }

        }


        // ==========================================
        // SIMPAN STORAGE
        // ==========================================

        function simpanStorage() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(dataGuru)
            );

        }


        // ==========================================
        // BUAT ID
        // ==========================================

        function buatId() {

            return (
                Date.now().toString() +
                Math.random()
                    .toString(36)
                    .substring(2, 8)
            );

        }


        // ==========================================
        // FORM SUBMIT
        // ==========================================

        document
            .getElementById("formGuru")
            .addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    const editId =
                        document.getElementById(
                            "editId"
                        ).value;


                    const nama =
                        document.getElementById(
                            "nama"
                        ).value.trim();


                    const nip =
                        document.getElementById(
                            "nip"
                        ).value.trim();


                    const nik =
                        document.getElementById(
                            "nik"
                        ).value.trim();


                    const jabatan =
                        document.getElementById(
                            "jabatan"
                        ).value;


                    const status =
                        document.getElementById(
                            "status"
                        ).value;


                    if (!nama) {

                        tampilkanPesan(
                            "Nama guru wajib diisi.",
                            "error"
                        );

                        return;

                    }


                    // ==================================
                    // EDIT
                    // ==================================

                    if (editId) {

                        const index =
                            dataGuru.findIndex(
                                guru =>
                                    String(guru.id) ===
                                    String(editId)
                            );


                        if (index !== -1) {

                            dataGuru[index] = {

                                ...dataGuru[index],

                                nama: nama,

                                nip: nip,

                                nik: nik,

                                jabatan: jabatan,

                                status: status

                            };

                        }


                        tampilkanPesan(
                            "Data guru berhasil diperbarui.",
                            "success"
                        );

                    }


                    // ==================================
                    // TAMBAH
                    // ==================================

                    else {

                        const guruBaru = {

                            id: buatId(),

                            nama: nama,

                            nip: nip,

                            nik: nik,

                            jabatan: jabatan,

                            status: status

                        };


                        dataGuru.push(
                            guruBaru
                        );


                        tampilkanPesan(
                            "Data guru berhasil ditambahkan.",
                            "success"
                        );

                    }


                    simpanStorage();

                    resetForm();

                    renderTabel();

                }
            );


        // ==========================================
        // RENDER TABEL
        // ==========================================

        function renderTabel() {

            const tbody =
                document.getElementById(
                    "tabelGuru"
                );


            const pencarian =
                document.getElementById(
                    "cariGuru"
                )
                .value
                .trim()
                .toLowerCase();


            const hasil =
                dataGuru.filter(guru => {

                    const nama =
                        String(
                            guru.nama ||
                            ""
                        ).toLowerCase();


                    const nip =
                        String(
                            guru.nip ||
                            ""
                        ).toLowerCase();


                    return (
                        nama.includes(pencarian) ||
                        nip.includes(pencarian)
                    );

                });


            document.getElementById(
                "jumlahGuru"
            ).textContent =
                dataGuru.length;


            if (!hasil.length) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="px-4 py-8 text-center text-gray-500">

                            ${
                                dataGuru.length
                                ? "Data guru tidak ditemukan."
                                : "Belum ada data guru."
                            }

                        </td>

                    </tr>

                `;

                return;

            }


            tbody.innerHTML =
                hasil.map(
                    (guru, index) => {

                        return `

                            <tr class="hover:bg-gray-50">

                                <td class="border-b px-4 py-3 text-center text-sm">
                                    ${index + 1}
                                </td>


                                <td class="border-b px-4 py-3 text-sm font-medium">
                                    ${escapeHTML(
                                        guru.nama ||
                                        "-"
                                    )}
                                </td>


                                <td class="border-b px-4 py-3 text-sm">
                                    ${escapeHTML(
                                        guru.nip ||
                                        "-"
                                    )}
                                </td>


                                <td class="border-b px-4 py-3 text-sm">
                                    ${escapeHTML(
                                        guru.jabatan ||
                                        "-"
                                    )}
                                </td>


                                <td class="border-b px-4 py-3 text-sm">
                                    ${escapeHTML(
                                        guru.status ||
                                        "-"
                                    )}
                                </td>


                                <td class="border-b px-4 py-3">

                                    <div class="flex justify-center gap-2">

                                        <button
                                            onclick="editGuru('${guru.id}')"
                                            class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1.5 rounded-lg text-sm">

                                            ✏️ Edit

                                        </button>


                                        <button
                                            onclick="hapusGuru('${guru.id}')"
                                            class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm">

                                            🗑️ Hapus

                                        </button>

                                    </div>

                                </td>

                            </tr>

                        `;

                    }
                )
                .join("");

        }


        // ==========================================
        // EDIT GURU
        // ==========================================

        function editGuru(id) {

            const guru =
                dataGuru.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (!guru) {

                tampilkanPesan(
                    "Data guru tidak ditemukan.",
                    "error"
                );

                return;

            }


            document.getElementById(
                "editId"
            ).value =
                guru.id;


            document.getElementById(
                "nama"
            ).value =
                guru.nama || "";


            document.getElementById(
                "nip"
            ).value =
                guru.nip || "";


            document.getElementById(
                "nik"
            ).value =
                guru.nik || "";


            document.getElementById(
                "jabatan"
            ).value =
                guru.jabatan || "";


            document.getElementById(
                "status"
            ).value =
                guru.status || "";


            document.getElementById(
                "judulForm"
            ).textContent =
                "✏️ Edit Data Guru";


            document.getElementById(
                "btnSimpan"
            ).textContent =
                "💾 Update Guru";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // ==========================================
        // HAPUS GURU
        // ==========================================

        function hapusGuru(id) {

            const guru =
                dataGuru.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (!guru) {

                return;

            }


            const yakin =
                confirm(
                    "Hapus data guru:\n\n" +
                    guru.nama +
                    "?"
                );


            if (!yakin) {

                return;

            }


            dataGuru =
                dataGuru.filter(
                    item =>
                        String(item.id) !==
                        String(id)
                );


            simpanStorage();

            renderTabel();


            tampilkanPesan(
                "Data guru berhasil dihapus.",
                "success"
            );

        }


        // ==========================================
        // RESET FORM
        // ==========================================

        function resetForm() {

            document.getElementById(
                "formGuru"
            ).reset();


            document.getElementById(
                "editId"
            ).value = "";


            document.getElementById(
                "judulForm"
            ).textContent =
                "➕ Tambah Data Guru";


            document.getElementById(
                "btnSimpan"
            ).textContent =
                "💾 Simpan Guru";

        }


        // ==========================================
        // PENCARIAN
        // ==========================================

        document
            .getElementById("cariGuru")
            .addEventListener(
                "input",
                renderTabel
            );


        // ==========================================
        // PESAN
        // ==========================================

        function tampilkanPesan(
            pesan,
            tipe
        ) {

            const element =
                document.getElementById(
                    "pesan"
                );


            element.textContent =
                pesan;


            element.classList.remove(
                "hidden",
                "bg-green-100",
                "text-green-800",
                "border-green-300",
                "bg-red-100",
                "text-red-800",
                "border-red-300"
            );


            if (tipe === "success") {

                element.classList.add(
                    "bg-green-100",
                    "text-green-800",
                    "border",
                    "border-green-300"
                );

            } else {

                element.classList.add(
                    "bg-red-100",
                    "text-red-800",
                    "border",
                    "border-red-300"
                );

            }


            setTimeout(
                function () {

                    element.classList.add(
                        "hidden"
                    );

                },
                3000
            );

        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==========================================
        // INIT
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadData();

                renderTabel();

            }
        );


        // ==========================================
        // UPDATE JIKA STORAGE BERUBAH
        // ==========================================

        window.addEventListener(
            "storage",
            function (event) {

                if (
                    event.key === STORAGE_KEY
                ) {

                    loadData();

                    renderTabel();

                }

            }
        );

    </script>

</body>
</html>
