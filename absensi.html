```html
<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Guru</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-blue-700 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-5">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

        <div>
          <h1 class="text-2xl font-bold">
            📋 Absensi Guru
          </h1>

          <p class="text-blue-100 text-sm">
            Catat kehadiran guru
          </p>
        </div>

        <button
          onclick="kembaliDashboard()"
          class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50"
        >
          ← Dashboard
        </button>

      </div>

    </div>
  </header>


  <!-- KONTEN -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- TANGGAL -->
    <section class="bg-white rounded-xl shadow p-5 mb-6">

      <label class="block font-semibold text-gray-700 mb-2">
        📅 Tanggal Absensi
      </label>

      <input
        type="date"
        id="tanggal"
        class="border rounded-lg px-4 py-2 w-full md:w-auto"
      >

      <div
        id="namaHari"
        class="mt-3 text-blue-700 font-semibold"
      ></div>

    </section>


    <!-- PENCARIAN -->
    <section class="bg-white rounded-xl shadow p-5 mb-6">

      <label class="block font-semibold text-gray-700 mb-2">
        🔎 Cari Guru
      </label>

      <input
        type="text"
        id="cariGuru"
        placeholder="Cari nama, NIP, atau jabatan..."
        class="border rounded-lg px-4 py-2 w-full"
      >

    </section>


    <!-- LIBUR -->
    <section
      id="holidayNotice"
      class="hidden bg-red-100 border border-red-300 text-red-700 rounded-xl p-5 mb-6"
    >

      <div class="font-bold text-lg mb-1">
        📅 Hari Libur
      </div>

      <div id="holidayText"></div>

    </section>


    <!-- RINGKASAN -->
    <section
      id="summarySection"
      class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6"
    >

      <div class="bg-white rounded-xl shadow p-5">
        <div class="text-gray-500 text-sm">
          Total Guru
        </div>

        <div
          id="totalGuru"
          class="text-3xl font-bold text-gray-800 mt-2"
        >
          0
        </div>
      </div>


      <div class="bg-white rounded-xl shadow p-5">
        <div class="text-gray-500 text-sm">
          Hadir
        </div>

        <div
          id="jumlahHadir"
          class="text-3xl font-bold text-green-600 mt-2"
        >
          0
        </div>
      </div>


      <div class="bg-white rounded-xl shadow p-5">
        <div class="text-gray-500 text-sm">
          Terlambat
        </div>

        <div
          id="jumlahTerlambat"
          class="text-3xl font-bold text-yellow-600 mt-2"
        >
          0
        </div>
      </div>


      <div class="bg-white rounded-xl shadow p-5">
        <div class="text-gray-500 text-sm">
          Izin / Sakit
        </div>

        <div
          id="jumlahIzinSakit"
          class="text-3xl font-bold text-blue-600 mt-2"
        >
          0
        </div>
      </div>


      <div class="bg-white rounded-xl shadow p-5">
        <div class="text-gray-500 text-sm">
          Alpa
        </div>

        <div
          id="jumlahAlpa"
          class="text-3xl font-bold text-red-600 mt-2"
        >
          0
        </div>
      </div>

    </section>


    <!-- ABSENSI -->
    <section
      id="attendanceSection"
      class="bg-white rounded-xl shadow overflow-hidden"
    >

      <!-- JUDUL -->
      <div class="p-5 border-b">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

          <div>

            <h2 class="text-xl font-bold text-gray-800">
              Daftar Kehadiran Guru
            </h2>

            <div
              id="tanggalTampil"
              class="text-sm text-blue-700 font-semibold mt-1"
            ></div>

          </div>


          <button
            id="btnSimpan"
            onclick="simpanAbsensi()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold shadow"
          >
            💾 Simpan Absensi
          </button>

        </div>

      </div>


      <!-- DATA KOSONG -->
      <div
        id="dataKosong"
        class="hidden p-8 text-center text-gray-500"
      >
        <div class="text-5xl mb-3">
          👨‍🏫
        </div>

        <p class="font-semibold">
          Belum ada data guru.
        </p>

        <p class="text-sm mt-1">
          Silakan tambahkan data guru terlebih dahulu.
        </p>
      </div>


      <!-- TABEL -->
      <div
        id="tableWrapper"
        class="overflow-x-auto"
      >

        <table class="w-full text-sm">

          <thead class="bg-gray-50 border-b">

            <tr>

              <th class="px-4 py-3 text-left">
                No
              </th>

              <th class="px-4 py-3 text-left">
                NIP
              </th>

              <th class="px-4 py-3 text-left">
                Nama Guru
              </th>

              <th class="px-4 py-3 text-left">
                Jabatan
              </th>

              <th class="px-4 py-3 text-left">
                Status
              </th>

              <th class="px-4 py-3 text-left">
                Keterangan
              </th>

            </tr>

          </thead>

          <tbody id="tabelAbsensi"></tbody>

        </table>

      </div>

    </section>

  </main>


<script>

  // ==========================================
  // DATA
  // ==========================================

  let dataGuru =
    JSON.parse(
      localStorage.getItem("dataGuru")
    ) || [];


  let dataAbsensi =
    JSON.parse(
      localStorage.getItem("dataAbsensi")
    ) || [];


  // PASTIKAN SELALU ARRAY
  if (!Array.isArray(dataAbsensi)) {
    dataAbsensi = [];
  }


  let dataHariLibur =
    JSON.parse(
      localStorage.getItem("dataHariLibur")
    ) || [];


  // ==========================================
  // ELEMENT
  // ==========================================

  const tanggalInput =
    document.getElementById("tanggal");

  const cariGuru =
    document.getElementById("cariGuru");

  const tabelAbsensi =
    document.getElementById("tabelAbsensi");

  const dataKosong =
    document.getElementById("dataKosong");

  const tableWrapper =
    document.getElementById("tableWrapper");

  const attendanceSection =
    document.getElementById("attendanceSection");

  const holidayNotice =
    document.getElementById("holidayNotice");

  const holidayText =
    document.getElementById("holidayText");

  const btnSimpan =
    document.getElementById("btnSimpan");

  const summarySection =
    document.getElementById("summarySection");

  const namaHari =
    document.getElementById("namaHari");

  const tanggalTampil =
    document.getElementById("tanggalTampil");


  // ==========================================
  // TANGGAL HARI INI
  // ==========================================

  const sekarang = new Date();

  const tahunSekarang =
    sekarang.getFullYear();

  const bulanSekarang =
    String(
      sekarang.getMonth() + 1
    ).padStart(2, "0");

  const hariSekarang =
    String(
      sekarang.getDate()
    ).padStart(2, "0");


  tanggalInput.value =
    `${tahunSekarang}-${bulanSekarang}-${hariSekarang}`;


  // ==========================================
  // INFO TANGGAL
  // ==========================================

  function getInfoTanggal(tanggal) {

    if (!tanggal) return null;

    const bagian =
      tanggal.split("-");

    const tahun =
      parseInt(bagian[0]);

    const bulan =
      parseInt(bagian[1]) - 1;

    const hari =
      parseInt(bagian[2]);


    const objekTanggal =
      new Date(
        tahun,
        bulan,
        hari
      );


    const daftarHari = [

      "Minggu",
      "Senin",
      "Selasa",
      "Rabu",
      "Kamis",
      "Jumat",
      "Sabtu"

    ];


    const daftarBulan = [

      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember"

    ];


    return {

      namaHari:
        daftarHari[
          objekTanggal.getDay()
        ],

      nomorHari:
        objekTanggal.getDay(),

      tanggal:
        hari,

      namaBulan:
        daftarBulan[bulan],

      tahun:
        tahun

    };

  }


  // ==========================================
  // FORMAT TANGGAL
  // ==========================================

  function formatTanggal(tanggal) {

    const info =
      getInfoTanggal(tanggal);

    if (!info) return "";

    return `${info.namaHari}, ${info.tanggal} ${info.namaBulan} ${info.tahun}`;

  }


  // ==========================================
  // CEK AKHIR PEKAN
  // ==========================================

  function cekAkhirPekan(tanggal) {

    const info =
      getInfoTanggal(tanggal);

    if (!info) return null;


    if (info.nomorHari === 6) {
      return "Sabtu";
    }


    if (info.nomorHari === 0) {
      return "Minggu";
    }


    return null;

  }


  // ==========================================
  // CEK LIBUR MANUAL
  // ==========================================

  function cekHariLiburManual(tanggal) {

    return dataHariLibur.find(
      item =>
        item.tanggal === tanggal
    );

  }


  // ==========================================
  // CEK STATUS LIBUR
  // ==========================================

  function cekStatusLibur(tanggal) {

    const akhirPekan =
      cekAkhirPekan(tanggal);


    if (akhirPekan) {

      return {

        tipe:
          "akhir-pekan",

        keterangan:
          `Akhir Pekan (${akhirPekan})`

      };

    }


    const liburManual =
      cekHariLiburManual(tanggal);


    if (liburManual) {

      return {

        tipe:
          "manual",

        keterangan:
          liburManual.keterangan

      };

    }


    return null;

  }


  // ==========================================
  // CEK TANGGAL
  // ==========================================

  function cekTanggal() {

    const tanggal =
      tanggalInput.value;


    const teksTanggal =
      formatTanggal(tanggal);


    namaHari.innerHTML =
      `📅 ${teksTanggal}`;


    tanggalTampil.innerHTML =
      `📅 ${teksTanggal}`;


    const statusLibur =
      cekStatusLibur(tanggal);


    // HARI LIBUR
    if (statusLibur) {

      holidayNotice
        .classList
        .remove("hidden");


      holidayText.innerHTML =
        `<strong>${teksTanggal}</strong>
        merupakan
        <strong>${statusLibur.keterangan}</strong>.`;


      attendanceSection
        .classList
        .add("hidden");


      summarySection
        .classList
        .add("hidden");


      return;

    }


    // HARI KERJA
    holidayNotice
      .classList
      .add("hidden");


    attendanceSection
      .classList
      .remove("hidden");


    summarySection
      .classList
      .remove("hidden");


    renderTabel();

  }


  // ==========================================
  // CARI ABSENSI GURU
  // ==========================================

  function cariAbsensi(guruId, tanggal) {

    return dataAbsensi.find(
      item => {

        const idGuru =
          item.guruId ||
          item.idGuru ||
          item.guru_id ||
          "";

        const tgl =
          item.tanggal ||
          item.date ||
          item.tgl ||
          "";

        return (
          String(idGuru) ===
            String(guruId) &&
          tgl === tanggal
        );

      }
    );

  }


  // ==========================================
  // RENDER TABEL
  // ==========================================

  function renderTabel() {

    const tanggal =
      tanggalInput.value;


    if (cekStatusLibur(tanggal)) {
      return;
    }


    tabelAbsensi.innerHTML =
      "";


    const keyword =
      cariGuru.value
        .toLowerCase()
        .trim();


    if (dataGuru.length === 0) {

      dataKosong
        .classList
        .remove("hidden");

      tableWrapper
        .classList
        .add("hidden");

      btnSimpan.disabled =
        true;

      btnSimpan.classList.add(
        "opacity-50",
        "cursor-not-allowed"
      );

      updateSummary();

      return;

    }


    dataKosong
      .classList
      .add("hidden");


    tableWrapper
      .classList
      .remove("hidden");


    btnSimpan.disabled =
      false;


    btnSimpan.classList.remove(
      "opacity-50",
      "cursor-not-allowed"
    );


    const dataTampil =
      dataGuru
        .map(
          (guru, index) => ({
            guru,
            index
          })
        )
        .filter(item => {

          const guru =
            item.guru;

          return (

            String(guru.nama || "")
              .toLowerCase()
              .includes(keyword)

            ||

            String(guru.nip || "")
              .toLowerCase()
              .includes(keyword)

            ||

            String(guru.jabatan || "")
              .toLowerCase()
              .includes(keyword)

          );

        });


    dataTampil.forEach(
      (item, nomor) => {

        const guru =
          item.guru;

        const index =
          item.index;


        let status =
          "Hadir";

        let keterangan =
          "";


        const dataLama =
          cariAbsensi(
            guru.id,
            tanggal
          );


        if (dataLama) {

          status =
            dataLama.status ||
            "Hadir";

          keterangan =
            dataLama.keterangan ||
            "";

        }


        const row =
          document.createElement("tr");


        row.className =
          "border-b hover:bg-gray-50";


        row.innerHTML = `

          <td class="px-4 py-3">
            ${nomor + 1}
          </td>

          <td class="px-4 py-3">
            ${guru.nip || "-"}
          </td>

          <td class="px-4 py-3 font-semibold text-gray-800">
            ${guru.nama || "-"}
          </td>

          <td class="px-4 py-3">
            ${guru.jabatan || "-"}
          </td>

          <td class="px-4 py-3">

            <select
              class="status-select border rounded-lg px-3 py-2 w-full"
              data-index="${index}"
            >

              <option
                value="Hadir"
                ${status === "Hadir" ? "selected" : ""}
              >
                Hadir
              </option>

              <option
                value="Terlambat"
                ${status === "Terlambat" ? "selected" : ""}
              >
                Terlambat
              </option>

              <option
                value="Izin"
                ${status === "Izin" ? "selected" : ""}
              >
                Izin
              </option>

              <option
                value="Sakit"
                ${status === "Sakit" ? "selected" : ""}
              >
                Sakit
              </option>

              <option
                value="Alpa"
                ${status === "Alpa" ? "selected" : ""}
              >
                Alpa
              </option>

            </select>

          </td>

          <td class="px-4 py-3">

            <input
              type="text"
              class="keterangan-input border rounded-lg px-3 py-2 w-full"
              data-index="${index}"
              value="${keterangan.replace(/"/g, "&quot;")}"
              placeholder="Keterangan..."
            >

          </td>

        `;


        tabelAbsensi
          .appendChild(row);

      });


    updateSummary();

  }


  // ==========================================
  // UPDATE RINGKASAN
  // ==========================================

  function updateSummary() {

    const tanggal =
      tanggalInput.value;


    if (cekStatusLibur(tanggal)) {
      return;
    }


    const selects =
      document.querySelectorAll(
        ".status-select"
      );


    let hadir = 0;
    let terlambat = 0;
    let izinSakit = 0;
    let alpa = 0;


    selects.forEach(select => {

      if (select.value === "Hadir") {
        hadir++;
      }

      else if (
        select.value === "Terlambat"
      ) {
        terlambat++;
      }

      else if (
        select.value === "Izin" ||
        select.value === "Sakit"
      ) {
        izinSakit++;
      }

      else if (
        select.value === "Alpa"
      ) {
        alpa++;
      }

    });


    document.getElementById(
      "totalGuru"
    ).textContent =
      dataGuru.length;


    document.getElementById(
      "jumlahHadir"
    ).textContent =
      hadir;


    document.getElementById(
      "jumlahTerlambat"
    ).textContent =
      terlambat;


    document.getElementById(
      "jumlahIzinSakit"
    ).textContent =
      izinSakit;


    document.getElementById(
      "jumlahAlpa"
    ).textContent =
      alpa;

  }


  // ==========================================
  // SIMPAN ABSENSI
  // ==========================================

  function simpanAbsensi() {

    const tanggal =
      tanggalInput.value;


    const statusLibur =
      cekStatusLibur(tanggal);


    if (statusLibur) {

      alert(
        "📅 Tanggal tersebut merupakan hari libur.\n\n" +
        statusLibur.keterangan +
        "\n\nAbsensi tidak dapat disimpan."
      );

      return;

    }


    if (dataGuru.length === 0) {

      alert(
        "Belum ada data guru."
      );

      return;

    }


    const selects =
      document.querySelectorAll(
        ".status-select"
      );


    const keterangans =
      document.querySelectorAll(
        ".keterangan-input"
      );


    // Pastikan data selalu ARRAY
    if (!Array.isArray(dataAbsensi)) {
      dataAbsensi = [];
    }


    selects.forEach(select => {

      const index =
        Number(
          select.dataset.index
        );


      const guru =
        dataGuru[index];


      if (!guru) return;


      const keteranganInput =
        Array.from(keterangans)
          .find(
            input =>
              Number(
                input.dataset.index
              ) === index
          );


      const status =
        select.value;


      const keterangan =
        keteranganInput
          ? keteranganInput.value.trim()
          : "";


      // Cari data lama
      const indexLama =
        dataAbsensi.findIndex(
          item => {

            const idGuru =
              item.guruId ||
              item.idGuru ||
              item.guru_id ||
              "";

            const tgl =
              item.tanggal ||
              item.date ||
              item.tgl ||
              "";


            return (

              String(idGuru) ===
                String(guru.id)

              &&

              tgl === tanggal

            );

          }
        );


      const dataBaru = {

        id:
          indexLama >= 0
            ? dataAbsensi[indexLama].id
            : Date.now().toString() +
              Math.random()
                .toString(36)
                .substring(2, 7),

        guruId:
          guru.id,

        namaGuru:
          guru.nama,

        tanggal:
          tanggal,

        status:
          status,

        keterangan:
          keterangan

      };


      // UPDATE
      if (indexLama >= 0) {

        dataAbsensi[indexLama] =
          dataBaru;

      }

      // TAMBAH
      else {

        dataAbsensi.push(
          dataBaru
        );

      }

    });


    // SIMPAN
    localStorage.setItem(
      "dataAbsensi",
      JSON.stringify(dataAbsensi)
    );


    // VERIFIKASI
    const hasil =
      JSON.parse(
        localStorage.getItem(
          "dataAbsensi"
        ) || "[]"
      );


    if (
      hasil.length >= 1
    ) {

      alert(
        "✅ Absensi berhasil disimpan!\n\n" +
        "Tanggal: " +
        formatTanggal(tanggal) +
        "\n" +
        "Total data absensi: " +
        hasil.length
      );

    }

  }


  // ==========================================
  // EVENT
  // ==========================================

  tanggalInput.addEventListener(
    "change",
    cekTanggal
  );


  cariGuru.addEventListener(
    "input",
    renderTabel
  );


  // ==========================================
  // KEMBALI
  // ==========================================

  function kembaliDashboard() {

    window.location.href =
      "dashboard.html";

  }


  // ==========================================
  // MULAI
  // ==========================================

  cekTanggal();

</script>

</body>
</html>
```
