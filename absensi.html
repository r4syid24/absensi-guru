```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Guru</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-blue-700 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-5">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

        <div>
          <h1 class="text-2xl font-bold">
            📋 Absensi Guru
          </h1>

          <p class="text-blue-100 text-sm mt-1">
            Catat kehadiran guru
          </p>
        </div>

        <a
          href="dashboard.html"
          class="inline-block bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition"
        >
          ← Dashboard
        </a>

      </div>

    </div>
  </header>


  <!-- CONTENT -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- TANGGAL & PENCARIAN -->
    <div class="bg-white rounded-xl shadow p-5 mb-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            📅 Tanggal Absensi
          </label>

          <input
            type="date"
            id="tanggalAbsensi"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>


        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            🔎 Cari Guru
          </label>

          <input
            type="text"
            id="cariGuru"
            placeholder="Cari nama atau NIP..."
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

      </div>

      <!-- INFO LIBUR -->
      <div
        id="infoLibur"
        class="hidden mt-5 bg-red-50 border border-red-200 text-red-700 rounded-lg p-4"
      ></div>

    </div>


    <!-- STATISTIK -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">

      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-sm text-gray-500">
          Total Guru
        </p>

        <p
          id="totalGuru"
          class="text-3xl font-bold text-gray-800 mt-1"
        >
          0
        </p>
      </div>


      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-sm text-gray-500">
          Hadir
        </p>

        <p
          id="jumlahHadir"
          class="text-3xl font-bold text-green-600 mt-1"
        >
          0
        </p>
      </div>


      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-sm text-gray-500">
          Terlambat
        </p>

        <p
          id="jumlahTerlambat"
          class="text-3xl font-bold text-yellow-600 mt-1"
        >
          0
        </p>
      </div>


      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-sm text-gray-500">
          Izin / Sakit
        </p>

        <p
          id="jumlahIzinSakit"
          class="text-3xl font-bold text-orange-600 mt-1"
        >
          0
        </p>
      </div>


      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-sm text-gray-500">
          Alpa
        </p>

        <p
          id="jumlahAlpa"
          class="text-3xl font-bold text-red-600 mt-1"
        >
          0
        </p>
      </div>

    </div>


    <!-- DAFTAR ABSENSI -->
    <div class="bg-white rounded-xl shadow overflow-hidden">

      <div class="p-5 border-b">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

          <div>
            <h2 class="text-lg font-bold text-gray-800">
              Daftar Kehadiran Guru
            </h2>

            <p
              id="tanggalTampil"
              class="text-sm text-gray-500 mt-1"
            ></p>
          </div>


          <button
            id="btnSimpan"
            onclick="simpanAbsensi()"
            class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition"
          >
            💾 Simpan Absensi
          </button>

        </div>

      </div>


      <!-- TABLE DESKTOP -->
      <div class="overflow-x-auto">

        <table class="w-full text-sm">

          <thead class="bg-gray-50 border-b">

            <tr>

              <th class="px-4 py-3 text-left">
                No
              </th>

              <th class="px-4 py-3 text-left">
                NIP
              </th>

              <th class="px-4 py-3 text-left">
                Nama Guru
              </th>

              <th class="px-4 py-3 text-left">
                Jabatan
              </th>

              <th class="px-4 py-3 text-left">
                Status
              </th>

              <th class="px-4 py-3 text-left">
                Keterangan
              </th>

            </tr>

          </thead>


          <tbody
            id="tabelAbsensi"
            class="divide-y"
          ></tbody>

        </table>

      </div>


      <!-- KOSONG -->
      <div
        id="dataKosong"
        class="hidden text-center py-10 text-gray-500"
      >
        Belum ada data guru.
      </div>

    </div>

  </main>


<script>

  /* =====================================================
     DATA
  ===================================================== */

  let dataGuru =
    JSON.parse(localStorage.getItem("dataGuru") || "[]");

  let dataAbsensi =
    JSON.parse(localStorage.getItem("dataAbsensi") || "[]");

  let dataHariLibur =
    JSON.parse(localStorage.getItem("dataHariLibur") || "[]");


  /* Pastikan dataAbsensi selalu ARRAY */
  if (!Array.isArray(dataAbsensi)) {
    dataAbsensi = [];
  }


  /* =====================================================
     ELEMENT
  ===================================================== */

  const tanggalInput =
    document.getElementById("tanggalAbsensi");

  const cariGuruInput =
    document.getElementById("cariGuru");

  const tabelAbsensi =
    document.getElementById("tabelAbsensi");

  const infoLibur =
    document.getElementById("infoLibur");

  const dataKosong =
    document.getElementById("dataKosong");


  /* =====================================================
     TANGGAL HARI INI
  ===================================================== */

  const hariIni =
    new Date().toISOString().split("T")[0];

  tanggalInput.value = hariIni;


  /* =====================================================
     FORMAT TANGGAL
  ===================================================== */

  function formatTanggal(tanggal) {

    if (!tanggal) return "-";

    const d = new Date(tanggal + "T00:00:00");

    return d.toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );
  }


  /* =====================================================
     CEK HARI LIBUR
  ===================================================== */

  function cekStatusLibur(tanggal) {

    if (!Array.isArray(dataHariLibur)) {
      return null;
    }

    return dataHariLibur.find(item => {

      const tgl =
        item.tanggal ||
        item.date ||
        item.tgl ||
        "";

      return tgl === tanggal;

    }) || null;
  }


  /* =====================================================
     CARI DATA ABSENSI
  ===================================================== */

  function cariAbsensi(guruId, tanggal) {

    if (!Array.isArray(dataAbsensi)) {
      return null;
    }

    return dataAbsensi.find(item => {

      const idGuru =
        item.guruId ||
        item.idGuru ||
        item.guru_id ||
        "";

      const tgl =
        item.tanggal ||
        item.date ||
        item.tgl ||
        "";

      return (
        String(idGuru) === String(guruId) &&
        tgl === tanggal
      );

    }) || null;
  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderAbsensi() {

    const tanggal =
      tanggalInput.value;

    const pencarian =
      cariGuruInput.value
        .toLowerCase()
        .trim();


    document.getElementById("tanggalTampil").innerText =
      "📅 " + formatTanggal(tanggal);


    /* CEK LIBUR */

    const statusLibur =
      cekStatusLibur(tanggal);


    if (statusLibur) {

      infoLibur.classList.remove("hidden");

      infoLibur.innerHTML =
        "📅 <strong>Hari Libur</strong><br>" +
        (
          statusLibur.keterangan ||
          statusLibur.nama ||
          statusLibur.namaHari ||
          "Tanggal ini merupakan hari libur."
        ) +
        "<br><br>Absensi tidak dapat disimpan.";

    } else {

      infoLibur.classList.add("hidden");

      infoLibur.innerHTML = "";

    }


    /* FILTER GURU */

    const guruTampil =
      dataGuru.filter(guru => {

        const nama =
          String(guru.nama || "")
            .toLowerCase();

        const nip =
          String(guru.nip || "")
            .toLowerCase();

        return (
          nama.includes(pencarian) ||
          nip.includes(pencarian)
        );

      });


    document.getElementById("totalGuru").innerText =
      guruTampil.length;


    tabelAbsensi.innerHTML = "";


    if (guruTampil.length === 0) {

      dataKosong.classList.remove("hidden");

      updateStatistik([]);

      return;

    }


    dataKosong.classList.add("hidden");


    guruTampil.forEach((guru, index) => {

      const absensi =
        cariAbsensi(guru.id, tanggal);


      const status =
        absensi?.status || "Hadir";


      const keterangan =
        absensi?.keterangan || "";


      const tr =
        document.createElement("tr");


      tr.className =
        "hover:bg-gray-50";


      tr.innerHTML = `

        <td class="px-4 py-3 align-top">
          ${index + 1}
        </td>

        <td class="px-4 py-3 align-top whitespace-nowrap">
          ${escapeHTML(guru.nip || "-")}
        </td>

        <td class="px-4 py-3 align-top font-semibold">
          ${escapeHTML(guru.nama || "-")}
        </td>

        <td class="px-4 py-3 align-top">
          ${escapeHTML(guru.jabatan || "-")}
        </td>

        <td class="px-4 py-3 align-top">

          <select
            class="status-select border border-gray-300 rounded-lg px-3 py-2 w-full min-w-[130px] focus:outline-none focus:ring-2 focus:ring-blue-500"
            data-guru-id="${escapeAttribute(guru.id)}"
          >

            <option value="Hadir"
              ${status === "Hadir" ? "selected" : ""}>
              Hadir
            </option>

            <option value="Terlambat"
              ${status === "Terlambat" ? "selected" : ""}>
              Terlambat
            </option>

            <option value="Izin"
              ${status === "Izin" ? "selected" : ""}>
              Izin
            </option>

            <option value="Sakit"
              ${status === "Sakit" ? "selected" : ""}>
              Sakit
            </option>

            <option value="Alpa"
              ${status === "Alpa" ? "selected" : ""}>
              Alpa
            </option>

          </select>

        </td>

        <td class="px-4 py-3 align-top">

          <input
            type="text"
            class="keterangan-input border border-gray-300 rounded-lg px-3 py-2 w-full min-w-[180px] focus:outline-none focus:ring-2 focus:ring-blue-500"
            data-guru-id="${escapeAttribute(guru.id)}"
            value="${escapeAttribute(keterangan)}"
            placeholder="Keterangan..."
          >

        </td>

      `;


      tabelAbsensi.appendChild(tr);

    });


    updateStatistik(guruTampil);

  }


  /* =====================================================
     STATISTIK
  ===================================================== */

  function updateStatistik(guruTampil) {

    const tanggal =
      tanggalInput.value;


    let hadir = 0;
    let terlambat = 0;
    let izin = 0;
    let sakit = 0;
    let alpa = 0;


    guruTampil.forEach(guru => {

      const data =
        cariAbsensi(guru.id, tanggal);


      const status =
        data?.status || "Hadir";


      if (status === "Hadir") {
        hadir++;
      }

      else if (status === "Terlambat") {
        terlambat++;
      }

      else if (status === "Izin") {
        izin++;
      }

      else if (status === "Sakit") {
        sakit++;
      }

      else if (status === "Alpa") {
        alpa++;
      }

    });


    document.getElementById("jumlahHadir").innerText =
      hadir;

    document.getElementById("jumlahTerlambat").innerText =
      terlambat;

    document.getElementById("jumlahIzinSakit").innerText =
      izin + sakit;

    document.getElementById("jumlahAlpa").innerText =
      alpa;

  }


  /* =====================================================
     SIMPAN ABSENSI
  ===================================================== */

  function simpanAbsensi() {

    const tanggal =
      tanggalInput.value;


    /* CEK LIBUR */

    const statusLibur =
      cekStatusLibur(tanggal);


    if (statusLibur) {

      alert(
        "📅 Tanggal tersebut merupakan hari libur.\n\n" +
        (
          statusLibur.keterangan ||
          statusLibur.nama ||
          "Hari libur"
        ) +
        "\n\nAbsensi tidak dapat disimpan."
      );

      return;

    }


    /* CEK GURU */

    if (dataGuru.length === 0) {

      alert(
        "Belum ada data guru."
      );

      return;

    }


    /* PASTIKAN ARRAY */

    if (!Array.isArray(dataAbsensi)) {
      dataAbsensi = [];
    }


    const selects =
      document.querySelectorAll(".status-select");


    const keterangans =
      document.querySelectorAll(".keterangan-input");


    let jumlahDisimpan = 0;


    selects.forEach(select => {

      const guruId =
        select.dataset.guruId;


      const guru =
        dataGuru.find(
          item =>
            String(item.id) === String(guruId)
        );


      if (!guru) return;


      const keteranganInput =
        Array.from(keterangans).find(
          input =>
            String(input.dataset.guruId) ===
            String(guruId)
        );


      const status =
        select.value;


      const keterangan =
        keteranganInput
          ? keteranganInput.value.trim()
          : "";


      /* CARI DATA LAMA */

      const indexLama =
        dataAbsensi.findIndex(item => {

          const idGuru =
            item.guruId ||
            item.idGuru ||
            item.guru_id ||
            "";

          const tgl =
            item.tanggal ||
            item.date ||
            item.tgl ||
            "";

          return (
            String(idGuru) === String(guru.id) &&
            tgl === tanggal
          );

        });


      /* DATA BARU */

      const dataBaru = {

        id:
          indexLama >= 0
            ? dataAbsensi[indexLama].id
            : Date.now().toString() +
              Math.random()
                .toString(36)
                .substring(2, 7),

        guruId:
          guru.id,

        namaGuru:
          guru.nama,

        tanggal:
          tanggal,

        status:
          status,

        keterangan:
          keterangan

      };


      /* UPDATE */

      if (indexLama >= 0) {

        dataAbsensi[indexLama] =
          dataBaru;

      }

      /* INSERT */

      else {

        dataAbsensi.push(
          dataBaru
        );

      }


      jumlahDisimpan++;

    });


    /* SIMPAN LOCAL STORAGE */

    localStorage.setItem(
      "dataAbsensi",
      JSON.stringify(dataAbsensi)
    );


    /* VERIFIKASI */

    const hasil =
      JSON.parse(
        localStorage.getItem("dataAbsensi") || "[]"
      );


    /* REFRESH */

    renderAbsensi();


    alert(
      "✅ Absensi berhasil disimpan!\n\n" +
      "Tanggal: " +
      formatTanggal(tanggal) +
      "\n" +
      "Guru diproses: " +
      jumlahDisimpan +
      "\n" +
      "Total data absensi: " +
      hasil.length
    );

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHTML(value);

  }


  /* =====================================================
     EVENT
  ===================================================== */

  tanggalInput.addEventListener(
    "change",
    renderAbsensi
  );


  cariGuruInput.addEventListener(
    "input",
    renderAbsensi
  );


  /* =====================================================
     JALANKAN
  ===================================================== */

  renderAbsensi();

</script>

</body>
</html>
