<script>

let dataGuru = [];
let dataAbsensi = {};
let dataHariLibur = [];


/* =====================================================
   BACA DATA
===================================================== */

function bacaData() {

  try {
    dataGuru = JSON.parse(
      localStorage.getItem("dataGuru") || "[]"
    );
  } catch {
    dataGuru = [];
  }


  try {
    dataAbsensi = JSON.parse(
      localStorage.getItem("dataAbsensi") || "{}"
    );
  } catch {
    dataAbsensi = {};
  }


  try {
    dataHariLibur = JSON.parse(
      localStorage.getItem("dataHariLibur") || "[]"
    );
  } catch {
    dataHariLibur = [];
  }

}


/* =====================================================
   TAHUN
===================================================== */

function isiTahun() {

  const select = document.getElementById("filterTahun");

  const sekarang = new Date().getFullYear();

  const tahun = new Set();

  tahun.add(sekarang);

  Object.keys(dataAbsensi).forEach(k => {

    const cocok = String(k).match(/(19|20)\d{2}/);

    if (cocok) {
      tahun.add(Number(cocok[0]));
    }

  });


  dataHariLibur.forEach(item => {

    if (item?.tanggal) {

      const cocok =
        String(item.tanggal).match(/(19|20)\d{2}/);

      if (cocok) {
        tahun.add(Number(cocok[0]));
      }

    }

  });


  for (
    let i = sekarang - 3;
    i <= sekarang + 2;
    i++
  ) {
    tahun.add(i);
  }


  select.innerHTML = "";

  [...tahun]
    .sort((a,b) => b-a)
    .forEach(t => {

      const option =
        document.createElement("option");

      option.value = t;
      option.textContent = t;

      if (t === sekarang) {
        option.selected = true;
      }

      select.appendChild(option);

    });

}


/* =====================================================
   NORMALISASI TEKS
===================================================== */

function normalisasiTeks(value) {

  return String(value ?? "")
    .trim()
    .toLowerCase();

}


/* =====================================================
   AMBIL STATUS
===================================================== */

function ambilStatus(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  if (typeof value === "string") {

    return normalisasiStatus(value);

  }


  if (typeof value === "object") {

    return normalisasiStatus(
      value.status ??
      value.kehadiran ??
      value.keteranganStatus ??
      value.keterangan ??
      value.jenis ??
      value.nilai ??
      ""
    );

  }


  return "";

}


/* =====================================================
   NORMALISASI STATUS
===================================================== */

function normalisasiStatus(status) {

  const s =
    normalisasiTeks(status);


  if (
    s === "hadir" ||
    s === "h" ||
    s.includes("hadir")
  ) {
    return "Hadir";
  }


  if (
    s === "terlambat" ||
    s === "t" ||
    s.includes("terlambat")
  ) {
    return "Hadir";
  }


  if (
    s === "izin" ||
    s === "i" ||
    s.includes("izin")
  ) {
    return "Izin";
  }


  if (
    s === "sakit" ||
    s === "s" ||
    s.includes("sakit")
  ) {
    return "Sakit";
  }


  if (
    s === "dinas" ||
    s === "d" ||
    s.includes("dinas")
  ) {
    return "Dinas";
  }


  if (
    s === "alpa" ||
    s === "alpha" ||
    s === "a" ||
    s.includes("alpa") ||
    s.includes("alpha")
  ) {
    return "Alpa";
  }


  return "";

}


/* =====================================================
   PENCARIAN REKURSIF
   Mencari data guru berdasarkan:
   - index
   - NIP
   - nama
===================================================== */

function cariStatus(data, guru, indexGuru, sudahDilihat = new Set()) {

  if (
    data === null ||
    data === undefined
  ) {
    return "";
  }


  if (
    typeof data !== "object"
  ) {
    return normalisasiStatus(data);
  }


  if (sudahDilihat.has(data)) {
    return "";
  }

  sudahDilihat.add(data);


  /*
    1. Coba langsung berdasarkan index
  */

  if (
    data[indexGuru] !== undefined
  ) {

    const hasil =
      cariStatus(
        data[indexGuru],
        guru,
        indexGuru,
        sudahDilihat
      );

    if (hasil) return hasil;

  }


  /*
    2. Coba berdasarkan NIP
  */

  if (
    guru.nip &&
    data[guru.nip] !== undefined
  ) {

    const hasil =
      cariStatus(
        data[guru.nip],
        guru,
        indexGuru,
        sudahDilihat
      );

    if (hasil) return hasil;

  }


  /*
    3. Coba berdasarkan nama
  */

  if (
    guru.nama &&
    data[guru.nama] !== undefined
  ) {

    const hasil =
      cariStatus(
        data[guru.nama],
        guru,
        indexGuru,
        sudahDilihat
      );

    if (hasil) return hasil;

  }


  /*
    4. Kalau objek ini sendiri berisi
       NIP / nama guru
  */

  const nipData =
    String(
      data.nip ??
      data.NIP ??
      data.kodeGuru ??
      ""
    );


  const namaData =
    normalisasiTeks(
      data.nama ??
      data.namaGuru ??
      data.guru ??
      data.nama_guru ??
      ""
    );


  if (
    (guru.nip && nipData === String(guru.nip)) ||
    (guru.nama && namaData === normalisasiTeks(guru.nama))
  ) {

    const status =
      ambilStatus(data);

    if (status) return status;

  }


  /*
    5. Coba status langsung pada objek
  */

  const statusLangsung =
    ambilStatus(data);

  if (statusLangsung) {

    /*
      Hanya gunakan status langsung
      bila objek terlihat seperti
      data absensi guru.
    */

    if (
      data.status !== undefined ||
      data.kehadiran !== undefined ||
      data.keteranganStatus !== undefined ||
      data.nilai !== undefined
    ) {

      return statusLangsung;

    }

  }


  /*
    6. Cari semua properti anak
  */

  for (
    const key of Object.keys(data)
  ) {

    const child =
      data[key];

    const hasil =
      cariStatus(
        child,
        guru,
        indexGuru,
        sudahDilihat
      );

    if (hasil) return hasil;

  }


  return "";

}


/* =====================================================
   CARI STATUS PADA SATU TANGGAL
===================================================== */

function ambilStatusGuru(
  tanggal,
  guru,
  indexGuru
) {

  const dataTanggal =
    dataAbsensi[tanggal];

  if (
    dataTanggal === undefined
  ) {
    return "";
  }


  /*
    Pertama cari secara langsung
  */

  const langsung =
    cariStatus(
      dataTanggal,
      guru,
      indexGuru
    );

  if (langsung) {
    return langsung;
  }


  return "";

}


/* =====================================================
   CEK TANGGAL
===================================================== */

function tanggalCocok(
  tanggal,
  tahun,
  bulan
) {

  if (
    typeof tanggal !== "string"
  ) {
    return false;
  }


  /*
    Mendukung YYYY-MM-DD
  */

  let tahunTanggal = "";
  let bulanTanggal = "";


  let m =
    tanggal.match(
      /^(\d{4})-(\d{2})-\d{2}$/
    );


  if (m) {

    tahunTanggal = m[1];
    bulanTanggal = m[2];

  }


  /*
    Mendukung DD-MM-YYYY
  */

  if (!m) {

    m =
      tanggal.match(
        /^(\d{2})-(\d{2})-(\d{4})$/
      );

    if (m) {

      tahunTanggal = m[3];
      bulanTanggal = m[2];

    }

  }


  if (
    tahunTanggal !== String(tahun)
  ) {
    return false;
  }


  if (
    bulan !== "semua" &&
    bulanTanggal !== bulan
  ) {
    return false;
  }


  return true;

}


/* =====================================================
   DAFTAR TANGGAL
===================================================== */

function daftarTanggal(
  tahun,
  bulan
) {

  return Object.keys(dataAbsensi)
    .filter(tanggal =>
      tanggalCocok(
        tanggal,
        tahun,
        bulan
      )
    );

}


/* =====================================================
   HITUNG
===================================================== */

function hitungGuru(
  guru,
  indexGuru,
  daftar
) {

  const hasil = {
    Hadir: 0,
    Izin: 0,
    Sakit: 0,
    Dinas: 0,
    Alpa: 0
  };


  daftar.forEach(tanggal => {

    const status =
      ambilStatusGuru(
        tanggal,
        guru,
        indexGuru
      );


    if (status === "Hadir") {
      hasil.Hadir++;
    }

    else if (status === "Izin") {
      hasil.Izin++;
    }

    else if (status === "Sakit") {
      hasil.Sakit++;
    }

    else if (status === "Dinas") {
      hasil.Dinas++;
    }

    else if (status === "Alpa") {
      hasil.Alpa++;
    }

  });


  hasil.Total =
    hasil.Hadir +
    hasil.Izin +
    hasil.Sakit +
    hasil.Dinas +
    hasil.Alpa;


  hasil.Persentase =
    hasil.Total
      ? hasil.Hadir / hasil.Total * 100
      : 0;


  return hasil;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   TAMPILKAN
===================================================== */

function tampilkanRekap() {

  bacaData();


  const bulan =
    document.getElementById("filterBulan").value;


  const tahun =
    document.getElementById("filterTahun").value;


  const cari =
    normalisasiTeks(
      document.getElementById("cariGuru").value
    );


  const daftar =
    daftarTanggal(
      tahun,
      bulan
    );


  const guruTampil =
    dataGuru.filter(guru => {

      if (!cari) {
        return true;
      }


      return [
        guru.nama,
        guru.nip,
        guru.jabatan
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase()
        .includes(cari);

    });


  let jumlahHadir = 0;
  let jumlahIzin = 0;
  let jumlahSakit = 0;
  let jumlahDinas = 0;
  let jumlahAlpa = 0;
  let jumlahData = 0;


  const tbody =
    document.getElementById("tabelRekap");

  tbody.innerHTML = "";


  guruTampil.forEach(
    (guru, nomor) => {

      const indexAsli =
        dataGuru.indexOf(guru);


      const hasil =
        hitungGuru(
          guru,
          indexAsli,
          daftar
        );


      jumlahHadir += hasil.Hadir;
      jumlahIzin += hasil.Izin;
      jumlahSakit += hasil.Sakit;
      jumlahDinas += hasil.Dinas;
      jumlahAlpa += hasil.Alpa;


      jumlahData += hasil.Total;


      const tr =
        document.createElement("tr");


      tr.className =
        "hover:bg-slate-50";


      tr.innerHTML = `

        <td class="border px-3 py-2 text-center">
          ${nomor + 1}
        </td>

        <td class="border px-3 py-2 font-semibold">
          ${escapeHTML(guru.nama || "-")}
        </td>

        <td class="border px-3 py-2 text-center">
          ${escapeHTML(guru.nip || "-")}
        </td>

        <td class="border px-3 py-2 text-center font-bold text-green-700">
          ${hasil.Hadir}
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Izin}
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Sakit}
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Dinas}
        </td>

        <td class="border px-3 py-2 text-center text-red-700">
          ${hasil.Alpa}
        </td>

        <td class="border px-3 py-2 text-center font-semibold">
          ${hasil.Persentase.toFixed(1)}%
        </td>

        <td class="border px-3 py-2 text-center font-semibold">
          ${hasil.Total}
        </td>

      `;


      tbody.appendChild(tr);

    }
  );


  if (
    guruTampil.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="10"
          class="border px-3 py-8 text-center text-slate-500">
          Tidak ada data guru.
        </td>
      </tr>
    `;

  }


  /*
    KARTU
  */

  document.getElementById("totalGuru")
    .textContent = dataGuru.length;


  document.getElementById("totalHadir")
    .textContent = jumlahHadir;


  document.getElementById("totalIzin")
    .textContent = jumlahIzin;


  document.getElementById("totalSakit")
    .textContent = jumlahSakit;


  document.getElementById("totalDinas")
    .textContent = jumlahDinas;


  document.getElementById("totalAlpa")
    .textContent = jumlahAlpa;


  /*
    NAMA BULAN
  */

  const bulanNama = [
    "",
    "Januari",
    "Februari",
    "Maret",
    "April",
    "Mei",
    "Juni",
    "Juli",
    "Agustus",
    "September",
    "Oktober",
    "November",
    "Desember"
  ];


  const namaBulan =
    bulan === "semua"
      ? "Semua Bulan"
      : bulanNama[
          parseInt(bulan)
        ];


  document.getElementById("periodeText")
    .textContent =
      `Periode: ${namaBulan} ${tahun}`;


  /*
    HARI LIBUR
  */

  const jumlahLibur =
    dataHariLibur.filter(item => {

      return item?.tanggal &&
        tanggalCocok(
          item.tanggal,
          tahun,
          bulan
        );

    }).length;


  document.getElementById("infoData")
    .textContent =
      `Menampilkan ${jumlahData} data absensi. ` +
      `Terdapat ${jumlahLibur} tanggal hari libur yang tersimpan. ` +
      `Terdapat ${daftar.length} tanggal absensi tersimpan.`;

}


/* =====================================================
   RESET
===================================================== */

function resetFilter() {

  document.getElementById("filterBulan")
    .value = "semua";


  document.getElementById("filterTahun")
    .value = new Date().getFullYear();


  document.getElementById("cariGuru")
    .value = "";


  tampilkanRekap();

}


/* =====================================================
   DASHBOARD
===================================================== */

function kembaliDashboard() {

  window.location.href =
    "dashboard.html";

}


/* =====================================================
   MULAI
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    bacaData();

    isiTahun();

    tampilkanRekap();

  }
);

</script>
