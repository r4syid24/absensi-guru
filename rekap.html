<script>

  /* =====================================================
     DATA LOCAL STORAGE
  ===================================================== */

  let dataGuru = [];
  let dataAbsensi = {};
  let dataHariLibur = [];


  function bacaData() {

    try {
      dataGuru = JSON.parse(
        localStorage.getItem("dataGuru") || "[]"
      );
    } catch (e) {
      dataGuru = [];
    }


    try {
      dataAbsensi = JSON.parse(
        localStorage.getItem("dataAbsensi") || "{}"
      );
    } catch (e) {
      dataAbsensi = {};
    }


    try {
      dataHariLibur = JSON.parse(
        localStorage.getItem("dataHariLibur") || "[]"
      );
    } catch (e) {
      dataHariLibur = [];
    }

  }



  /* =====================================================
     TAHUN
  ===================================================== */

  function isiTahun() {

    const select = document.getElementById("filterTahun");

    const tahunSekarang = new Date().getFullYear();

    const tahunSet = new Set();

    tahunSet.add(tahunSekarang);

    Object.keys(dataAbsensi || {}).forEach(tanggal => {

      if (/^\d{4}-\d{2}-\d{2}$/.test(tanggal)) {
        tahunSet.add(tanggal.substring(0, 4));
      }

    });


    dataHariLibur.forEach(item => {

      if (
        item &&
        typeof item.tanggal === "string" &&
        /^\d{4}-\d{2}-\d{2}$/.test(item.tanggal)
      ) {
        tahunSet.add(item.tanggal.substring(0, 4));
      }

    });


    for (let i = tahunSekarang - 3; i <= tahunSekarang + 2; i++) {
      tahunSet.add(i);
    }


    const tahunArray = [...tahunSet]
      .map(Number)
      .sort((a, b) => b - a);


    select.innerHTML = "";


    tahunArray.forEach(tahun => {

      const option = document.createElement("option");

      option.value = tahun;
      option.textContent = tahun;

      if (tahun === tahunSekarang) {
        option.selected = true;
      }

      select.appendChild(option);

    });

  }



  /* =====================================================
     FORMAT TANGGAL
  ===================================================== */

  function formatTanggalIndonesia(tanggal) {

    const bulan = [
      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember"
    ];

    if (!tanggal) return "";

    const bagian = tanggal.split("-");

    if (bagian.length !== 3) return tanggal;

    const tahun = bagian[0];
    const nomorBulan = parseInt(bagian[1], 10);
    const hari = parseInt(bagian[2], 10);

    return `${hari} ${bulan[nomorBulan - 1]} ${tahun}`;

  }



  /* =====================================================
     NORMALISASI STATUS
  ===================================================== */

  function normalisasiStatus(data) {

    if (data === null || data === undefined) {
      return "";
    }


    if (typeof data === "string") {

      return data
        .trim()
        .toLowerCase();

    }


    if (typeof data === "object") {

      const status =
        data.status ??
        data.kehadiran ??
        data.keteranganStatus ??
        data.keterangan ??
        "";

      return String(status)
        .trim()
        .toLowerCase();

    }


    return "";

  }



  /* =====================================================
     KONVERSI STATUS
  ===================================================== */

  function statusStandar(data) {

    const status = normalisasiStatus(data);


    if (
      status === "hadir" ||
      status === "h" ||
      status.includes("hadir")
    ) {
      return "Hadir";
    }


    if (
      status === "terlambat" ||
      status === "t" ||
      status.includes("terlambat")
    ) {
      return "Hadir";
    }


    if (
      status === "izin" ||
      status === "i" ||
      status.includes("izin")
    ) {
      return "Izin";
    }


    if (
      status === "sakit" ||
      status === "s" ||
      status.includes("sakit")
    ) {
      return "Sakit";
    }


    if (
      status === "dinas" ||
      status === "d" ||
      status.includes("dinas")
    ) {
      return "Dinas";
    }


    if (
      status === "alpa" ||
      status === "alpha" ||
      status === "a" ||
      status.includes("alpa") ||
      status.includes("alpha")
    ) {
      return "Alpa";
    }


    return "";

  }



  /* =====================================================
     MENGAMBIL DATA ABSENSI GURU
  ===================================================== */

  function ambilDataGuruPadaTanggal(tanggal, guru, indexGuru) {

    const dataTanggal = dataAbsensi?.[tanggal];

    if (
      dataTanggal === undefined ||
      dataTanggal === null
    ) {
      return "";
    }


    /*
      PRIORITAS 1
      index guru
    */

    if (
      typeof dataTanggal === "object" &&
      dataTanggal[indexGuru] !== undefined
    ) {

      const hasil = statusStandar(
        dataTanggal[indexGuru]
      );

      if (hasil) return hasil;

    }


    /*
      PRIORITAS 2
      NIP
    */

    if (
      guru.nip &&
      typeof dataTanggal === "object" &&
      dataTanggal[guru.nip] !== undefined
    ) {

      const hasil = statusStandar(
        dataTanggal[guru.nip]
      );

      if (hasil) return hasil;

    }


    /*
      PRIORITAS 3
      NAMA
    */

    if (
      guru.nama &&
      typeof dataTanggal === "object" &&
      dataTanggal[guru.nama] !== undefined
    ) {

      const hasil = statusStandar(
        dataTanggal[guru.nama]
      );

      if (hasil) return hasil;

    }


    /*
      Jika data tanggal berupa array
    */

    if (Array.isArray(dataTanggal)) {

      const item = dataTanggal[indexGuru];

      const hasil = statusStandar(item);

      if (hasil) return hasil;

    }


    /*
      Jika data tanggal langsung berupa data guru tunggal
    */

    if (
      dataTanggal.status ||
      dataTanggal.kehadiran
    ) {

      const hasil = statusStandar(dataTanggal);

      if (hasil) return hasil;

    }


    return "";

  }



  /* =====================================================
     CEK TANGGAL SESUAI FILTER
  ===================================================== */

  function tanggalSesuaiFilter(tanggal, tahun, bulan) {

    if (
      typeof tanggal !== "string" ||
      !/^\d{4}-\d{2}-\d{2}$/.test(tanggal)
    ) {
      return false;
    }


    if (!tanggal.startsWith(String(tahun))) {
      return false;
    }


    if (
      bulan !== "semua" &&
      tanggal.substring(5, 7) !== bulan
    ) {
      return false;
    }


    return true;

  }



  /* =====================================================
     MENGAMBIL SEMUA TANGGAL ABSENSI
  ===================================================== */

  function daftarTanggalAbsensi(tahun, bulan) {

    return Object.keys(dataAbsensi || {})
      .filter(tanggal =>
        tanggalSesuaiFilter(
          tanggal,
          tahun,
          bulan
        )
      )
      .sort();

  }



  /* =====================================================
     REKAP
  ===================================================== */

  function hitungGuru(guru, indexGuru, tanggalList) {

    const hasil = {
      Hadir: 0,
      Izin: 0,
      Sakit: 0,
      Dinas: 0,
      Alpa: 0
    };


    tanggalList.forEach(tanggal => {

      const status =
        ambilDataGuruPadaTanggal(
          tanggal,
          guru,
          indexGuru
        );


      if (status === "Hadir") {
        hasil.Hadir++;
      }

      else if (status === "Izin") {
        hasil.Izin++;
      }

      else if (status === "Sakit") {
        hasil.Sakit++;
      }

      else if (status === "Dinas") {
        hasil.Dinas++;
      }

      else if (status === "Alpa") {
        hasil.Alpa++;
      }

    });


    hasil.Total =
      hasil.Hadir +
      hasil.Izin +
      hasil.Sakit +
      hasil.Dinas +
      hasil.Alpa;


    hasil.Persentase =
      hasil.Total > 0
        ? (hasil.Hadir / hasil.Total) * 100
        : 0;


    return hasil;

  }



  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHTML(teks) {

    return String(teks ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }



  /* =====================================================
     TAMPILKAN REKAP
  ===================================================== */

  function tampilkanRekap() {

    bacaData();


    const bulan =
      document.getElementById("filterBulan").value;

    const tahun =
      document.getElementById("filterTahun").value;

    const pencarian =
      document.getElementById("cariGuru")
        .value
        .trim()
        .toLowerCase();


    const tanggalList =
      daftarTanggalAbsensi(
        tahun,
        bulan
      );


    let guruTampil =
      dataGuru.filter(guru => {

        if (!pencarian) return true;

        const teks = [
          guru.nama,
          guru.nip,
          guru.jabatan
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return teks.includes(pencarian);

      });


    let totalHadir = 0;
    let totalIzin = 0;
    let totalSakit = 0;
    let totalDinas = 0;
    let totalAlpa = 0;


    const tbody =
      document.getElementById("tabelRekap");

    tbody.innerHTML = "";


    guruTampil.forEach((guru, indexTampil) => {

      const indexAsli =
        dataGuru.indexOf(guru);


      const hasil =
        hitungGuru(
          guru,
          indexAsli,
          tanggalList
        );


      totalHadir += hasil.Hadir;
      totalIzin += hasil.Izin;
      totalSakit += hasil.Sakit;
      totalDinas += hasil.Dinas;
      totalAlpa += hasil.Alpa;


      const tr =
        document.createElement("tr");

      tr.className =
        "hover:bg-slate-50";


      tr.innerHTML = `

        <td class="border px-3 py-2 text-center">
          ${indexTampil + 1}
        </td>

        <td class="border px-3 py-2 font-semibold">
          ${escapeHTML(guru.nama || "-")}
        </td>

        <td class="border px-3 py-2 text-center">
          ${escapeHTML(guru.nip || "-")}
        </td>

        <td class="border px-3 py-2 text-center font-semibold text-green-700">
          ${hasil.Hadir}
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Izin}
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Sakit}
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Dinas}
        </td>

        <td class="border px-3 py-2 text-center text-red-700">
          ${hasil.Alpa}
        </td>

        <td class="border px-3 py-2 text-center font-semibold">
          ${hasil.Persentase.toFixed(1)}%
        </td>

        <td class="border px-3 py-2 text-center">
          ${hasil.Total}
        </td>

      `;


      tbody.appendChild(tr);

    });


    if (guruTampil.length === 0) {

      tbody.innerHTML = `

        <tr>
          <td
            colspan="10"
            class="border px-3 py-8 text-center text-slate-500">
            Tidak ada data guru yang sesuai pencarian.
          </td>
        </tr>

      `;

    }


    /*
      UPDATE KARTU
    */

    document.getElementById("totalGuru")
      .textContent = dataGuru.length;


    document.getElementById("totalHadir")
      .textContent = totalHadir;


    document.getElementById("totalIzin")
      .textContent = totalIzin;


    document.getElementById("totalSakit")
      .textContent = totalSakit;


    document.getElementById("totalDinas")
      .textContent = totalDinas;


    document.getElementById("totalAlpa")
      .textContent = totalAlpa;


    /*
      PERIODE
    */

    let namaBulan = "Semua Bulan";

    if (bulan !== "semua") {

      const daftarBulan = [
        "",
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"
      ];

      namaBulan =
        daftarBulan[
          parseInt(bulan, 10)
        ];

    }


    document.getElementById("periodeText")
      .textContent =
      `Periode: ${namaBulan} ${tahun}`;


    /*
      HITUNG DATA ABSENSI YANG BENAR-BENAR TERISI
    */

    let jumlahDataTerisi = 0;


    dataGuru.forEach((guru, indexGuru) => {

      tanggalList.forEach(tanggal => {

        const status =
          ambilDataGuruPadaTanggal(
            tanggal,
            guru,
            indexGuru
          );

        if (status) {
          jumlahDataTerisi++;
        }

      });

    });


    /*
      HARI LIBUR
    */

    const jumlahHariLibur =
      dataHariLibur.filter(item => {

        if (
          !item ||
          typeof item.tanggal !== "string"
        ) {
          return false;
        }

        return tanggalSesuaiFilter(
          item.tanggal,
          tahun,
          bulan
        );

      }).length;


    document.getElementById("infoData")
      .textContent =
      `Menampilkan ${jumlahDataTerisi} data absensi. ` +
      `Terdapat ${jumlahHariLibur} tanggal hari libur yang tersimpan. ` +
      `Terdapat ${tanggalList.length} tanggal yang tersimpan pada data absensi.`;

  }



  /* =====================================================
     RESET
  ===================================================== */

  function resetFilter() {

    document.getElementById("filterBulan")
      .value = "semua";

    document.getElementById("filterTahun")
      .value = new Date().getFullYear();

    document.getElementById("cariGuru")
      .value = "";

    tampilkanRekap();

  }



  /* =====================================================
     KEMBALI
  ===================================================== */

  function kembaliDashboard() {

    window.location.href =
      "dashboard.html";

  }



  /* =====================================================
     INIT
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      bacaData();

      isiTahun();

      tampilkanRekap();

    }
  );

</script>
